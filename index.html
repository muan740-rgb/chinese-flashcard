<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汉语词卡 · แฟลชการ์ดคำศัพท์จีน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Ma+Shan+Zheng&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--red:#b3201f;--red2:#8a1514;--gold:#c9a24a;--gold2:#e6c878;--paper:#f6ecd6;--paper2:#fbf5e6;--ink:#2b1d14;--mute:#7b6a58;--jade:#2f7a5b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Sarabun",system-ui,sans-serif;
 background:
  radial-gradient(circle at 20% 0,rgba(201,162,74,.18),transparent 40%),
  repeating-linear-gradient(45deg,rgba(179,32,31,.035) 0 12px,transparent 12px 24px),var(--paper)}
header{background:linear-gradient(var(--red),var(--red2));color:var(--gold2);text-align:center;padding:18px 12px 14px;border-bottom:4px solid var(--gold);position:relative;overflow:hidden}
header:before{content:"福";position:absolute;right:-10px;top:-30px;font:900 8rem "Noto Serif SC",serif;color:rgba(255,255,255,.07)}
header h1{margin:0;font:400 2.1rem "Ma Shan Zheng","Noto Serif SC",serif;letter-spacing:.2em}
header p{margin:2px 0 0;font-size:.85rem;color:#f3dfae;letter-spacing:.1em}
main{max-width:560px;margin:0 auto;padding:16px}
#warn{display:none;background:#fff3cd;color:#664d03;border:1px solid #e6c878;border-radius:8px;padding:8px 12px;font-size:.85rem;margin-bottom:10px}
.seg{display:flex;border:2px solid var(--red);border-radius:10px;overflow:hidden;background:var(--paper2)}
.seg button{flex:1;border:0;background:none;padding:9px 4px;font:600 .95rem "Sarabun",sans-serif;color:var(--red);cursor:pointer}
.seg button.on{background:var(--red);color:var(--gold2)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
select,.tog,.ghost{font:inherit;font-size:.9rem;color:var(--ink);background:var(--paper2);border:1.5px solid var(--gold);border-radius:8px;padding:7px 10px;cursor:pointer}
.tog.on{background:var(--gold);color:var(--red2);font-weight:600}
.prog{height:6px;background:rgba(179,32,31,.15);border-radius:4px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));width:0;transition:width .3s}
#status{font-size:.85rem;color:var(--mute);margin-top:6px;display:flex;justify-content:space-between}
.scene{perspective:1100px;height:340px;cursor:pointer;margin-top:12px}
.card{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;background:var(--paper2);border:3px double var(--gold);outline:6px solid var(--red);outline-offset:-1px;box-shadow:0 10px 24px rgba(90,20,10,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.face:before,.face:after{content:"❖";position:absolute;color:var(--gold);font-size:1rem}
.face:before{top:12px;left:14px}.face:after{bottom:12px;right:14px}
.back{transform:rotateY(180deg);background:linear-gradient(var(--paper2),#f3e6c4)}
.hanzi{font:900 4.2rem/1.2 "Noto Serif SC","Songti SC","SimSun",serif;color:var(--red2);word-break:break-all}
.hz-s{font:600 2rem "Noto Serif SC",serif;color:var(--red2)}
.pinyin{font-size:1.6rem;color:var(--red);margin-top:8px;font-weight:600}
.thai{font-size:1.05rem;color:var(--mute);margin-top:6px}
.mean{font-size:1.4rem;margin-top:12px;font-weight:600}
.hint{position:absolute;bottom:12px;left:0;right:0;font-size:.75rem;color:var(--mute)}
.spk{position:absolute;top:8px;right:10px;background:none;border:0;font-size:1.3rem;cursor:pointer}
.seal{position:absolute;top:14px;left:38px;width:38px;height:38px;border:2px solid var(--red);color:var(--red);border-radius:4px;font:900 1.2rem/34px "Noto Serif SC",serif;transform:rotate(-8deg);opacity:0;transition:.2s}
.seal.on{opacity:.85}
.row{display:flex;gap:10px;margin-top:14px}
.act{flex:1;padding:12px 6px;border-radius:10px;font:600 1rem "Sarabun",sans-serif;cursor:pointer;border:2px solid}
#no{background:var(--paper2);color:var(--red);border-color:var(--red)}
#yes{background:var(--jade);color:#fff;border-color:var(--jade)}
.act small{display:block;font:400 .7rem "Noto Serif SC",serif;opacity:.8}
.nav{justify-content:space-between}
.empty{padding:60px 10px;text-align:center;color:var(--mute);font-size:1.05rem}
footer{text-align:center;color:var(--mute);font-size:.75rem;padding:8px 0 24px}
</style>
</head>
<body>
<header><h1>汉语词卡</h1><p>แฟลชการ์ดคำศัพท์ภาษาจีน</p></header>
<main>
  <div id="warn"></div>
  <div class="seg" id="filter">
    <button data-f="all" class="on">ทั้งหมด</button>
    <button data-f="todo">ยังไม่รู้</button>
    <button data-f="done">จำได้แล้ว</button>
  </div>
  <div class="bar">
    <select id="range" aria-label="ช่วงคำ"></select>
    <select id="dir" aria-label="ทิศทาง">
      <option value="zh">จีน → ไทย</option>
      <option value="th">ไทย → จีน</option>
    </select>
    <button class="tog" id="shuf">🔀 สุ่มลำดับ</button>
    <button class="ghost" id="reset">ล้างความจำ</button>
  </div>
  <div class="prog"><i id="bar"></i></div>
  <div id="status"></div>
  <div id="stage"></div>
</main>
<footer>ช่องว่าง = พลิก · ← → = เลื่อน · 1 = ยังไม่รู้ · 2 = จำได้แล้ว</footer>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQL9TJxC8JOVusRustT0z-IkMeYINjzPXGGjym_QDWdY9pXgpsJ6bC628iCnU4WPjdhKNbmk83AYoYb/pub?gid=0&single=true&output=csv";
const BLOCK = 100;
const SAMPLE = `ลำดับ,ภาษาจีนและพินอิน,คำอ่านไทย,คำแปล
1,安慰ānwèi,อันเว่ย,"ปลอบใจ, ปลอบโยน"
2,岸àn,อั้น,"ฝั่ง, ตลิ่ง, ชายฝั่ง"
3,按摩ànmó,อั้นหมัว,นวด
4,宾馆bīnguǎn,ปินกว่าน,โรงแรม
5,博物馆bówùguǎn,ปั๋วอู้กว่าน,พิพิธภัณฑ์
6,厨房chúfáng,ฉูฝาง,ห้องครัว
7,聪明cōngming,ชงหมิง,ฉลาด
8,蛋糕dàngāo,ต้านเกา,เค้ก`;

const $ = id => document.getElementById(id);
let all = [], deck = [], i = 0, flipped = false, filter = "all", shuffle = false, known = {};
try { known = JSON.parse(localStorage.getItem("zh-known") || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem("zh-known", JSON.stringify(known)); } catch (e) {} };

function parseCSV(t) {
  const rows = []; let row = [], c = "", q = false;
  for (let k = 0; k < t.length; k++) {
    const ch = t[k];
    if (q) { if (ch === '"') { if (t[k + 1] === '"') { c += '"'; k++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(c); c = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && t[k + 1] === "\n") k++; row.push(c); rows.push(row); row = []; c = ""; }
    else c += ch;
  }
  if (c || row.length) { row.push(c); rows.push(row); }
  return rows;
}

const HANZI = /^([\u3400-\u9fff\uf900-\ufaff（）]+)\s*(.*)$/;
function toCards(text) {
  return parseCSV(text).slice(1).filter(r => r[1] && r[1].trim()).map(r => {
    const raw = r[1].trim(), m = raw.match(HANZI);
    return { key: raw, hanzi: m ? m[1] : raw, pinyin: m ? m[2].trim() : "", thai: (r[2] || "").trim(), mean: (r[3] || "").trim() };
  });
}

function buildRanges() {
  const n = all.length, sel = $("range");
  sel.innerHTML = `<option value="-1">ทุกช่วง (${n} คำ)</option>`;
  for (let s = 0; s < n; s += BLOCK) sel.innerHTML += `<option value="${s}">คำที่ ${s + 1}–${Math.min(s + BLOCK, n)}</option>`;
}

function buildDeck(keepPos) {
  const s = +$("range").value;
  let d = s < 0 ? all.slice() : all.slice(s, s + BLOCK);
  if (filter === "todo") d = d.filter(c => !known[c.key]);
  if (filter === "done") d = d.filter(c => known[c.key]);
  if (shuffle) for (let a = d.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [d[a], d[b]] = [d[b], d[a]]; }
  deck = d; if (!keepPos) i = 0; flipped = false; render();
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/（.*?）/g, ""));
  u.lang = "zh-CN"; u.rate = .85; speechSynthesis.speak(u);
}

function render() {
  const done = all.filter(c => known[c.key]).length;
  $("bar").style.width = (all.length ? done / all.length * 100 : 0) + "%";
  $("status").innerHTML = `<span>${deck.length ? `การ์ด ${i + 1} / ${deck.length}` : ""}</span><span>จำได้แล้ว ${done} / ${all.length} คำ</span>`;
  const stage = $("stage");
  if (!deck.length) {
    stage.innerHTML = `<div class="empty">${filter === "todo" ? "ไม่เหลือคำที่ยังไม่รู้แล้ว 🎉" : filter === "done" ? "ยังไม่มีคำที่มาร์คว่าจำได้" : "ไม่มีการ์ด"}</div>`;
    return;
  }
  const c = deck[i], th = $("dir").value === "th", k = !!known[c.key];
  const front = th ? `<div class="mean" style="margin:0">${c.mean}</div><div class="thai">${c.thai}</div>` : `<div class="hanzi">${c.hanzi}</div>`;
  const back = th
    ? `<div class="hanzi">${c.hanzi}</div><div class="pinyin">${c.pinyin}</div>`
    : `<div class="hz-s">${c.hanzi}</div><div class="pinyin">${c.pinyin}</div><div class="thai">อ่านว่า: ${c.thai}</div><div class="mean">${c.mean}</div>`;
  stage.innerHTML = `
    <div class="scene" id="scene"><div class="card ${flipped ? "flip" : ""}" id="card">
      <div class="face">${front}<span class="seal ${k ? "on" : ""}">会</span><button class="spk" id="s1" title="ฟังเสียง">🔊</button><span class="hint">แตะเพื่อพลิกดูคำแปล</span></div>
      <div class="face back">${back}<span class="seal ${k ? "on" : ""}">会</span><button class="spk" id="s2" title="ฟังเสียง">🔊</button></div>
    </div></div>
    <div class="row">
      <button class="act" id="no">✗ ยังไม่รู้<small>还不会</small></button>
      <button class="act" id="yes">✓ จำได้แล้ว<small>记住了</small></button>
    </div>
    <div class="row nav"><button class="ghost" id="prev">← ก่อนหน้า</button><button class="ghost" id="next">ถัดไป →</button></div>`;
  $("scene").onclick = flip;
  $("s1").onclick = $("s2").onclick = e => { e.stopPropagation(); speak(c.hanzi); };
  $("no").onclick = () => mark(false); $("yes").onclick = () => mark(true);
  $("prev").onclick = () => go(-1); $("next").onclick = () => go(1);
}

function flip() { flipped = !flipped; const el = $("card"); if (el) el.classList.toggle("flip", flipped); }
function go(d) { if (!deck.length) return; i = (i + d + deck.length) % deck.length; flipped = false; render(); }
function mark(ok) {
  if (!deck.length) return;
  const k = deck[i].key;
  if (ok) known[k] = 1; else delete known[k];
  save();
  const leaves = (filter === "todo" && ok) || (filter === "done" && !ok);
  if (leaves) { deck.splice(i, 1); if (i >= deck.length) i = 0; flipped = false; render(); }
  else go(1);
}

document.addEventListener("keydown", e => {
  if (["SELECT", "INPUT"].includes(document.activeElement.tagName)) return;
  if (e.code === "Space") { e.preventDefault(); flip(); }
  else if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "1") mark(false);
  else if (e.key === "2") mark(true);
});

document.querySelectorAll("#filter button").forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll("#filter button").forEach(x => x.classList.toggle("on", x === b));
  buildDeck();
});
$("range").onchange = () => buildDeck();
$("dir").onchange = () => render();
$("shuf").onclick = () => { shuffle = !shuffle; $("shuf").classList.toggle("on", shuffle); buildDeck(); };
$("reset").onclick = () => { if (confirm("ล้างความคืบหน้าทั้งหมด?")) { known = {}; save(); buildDeck(); } };

async function init() {
  let text;
  try {
    const res = await fetch(SHEET_URL);
    if (!res.ok) throw new Error(res.status);
    text = await res.text();
  } catch (err) {
    const w = $("warn"); w.style.display = "block";
    w.textContent = "โหลดจาก Google Sheet ไม่สำเร็จ จึงแสดงคำตัวอย่างแทน (ตรวจสอบว่าเผยแพร่ชีตเป็น CSV และเปิดหน้านี้ผ่านเว็บเซิร์ฟเวอร์)";
    text = SAMPLE;
  }
  all = toCards(text);
  buildRanges(); buildDeck();
}
init();
</script>
</body>
</html>
